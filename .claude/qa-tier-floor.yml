# File-path tier-floor map — Beamix QA-Lead enforcement
# Locked 2026-05-16 (board decision #4 — replaces Haiku tier classifier; zero LLM cost).
# Used by .github/workflows/qa-lead-pass.yml to set the MINIMUM risk tier
# any PR touching the matching files must carry. Workers may upgrade; never downgrade.
#
# Tiers (ascending severity): trivial < lite < full < irreversible
#
# Match semantics — CONFIRMED against the consuming step ("Auto-tier from
# file-path tier-floor map" in .github/workflows/qa-lead-pass.yml, F15) on
# 2026-08-09: this is HIGHEST-TIER-WINS, NOT first-match-wins. For each
# changed file, the workflow scans every rule below and keeps the MAXIMUM
# rank among all patterns that match — order in this file has no effect on
# the resolved tier. A specific rule is therefore never "shadowed" by a
# broader rule that appears earlier; conversely, a broader rule with a
# HIGHER tier than a nested specific rule cannot be carved down by placing
# the specific rule first (an earlier attempt to carve `_seeds/**` down from
# `.claude/agents/**`'s irreversible floor was dropped for exactly this
# reason — see docs/08-agents_work/sessions/2026-05-29-ceo-war-room-seed-
# externalize.md). Group rules by tier for human readability only; do not
# rely on ordering for correctness. When adding a narrower rule to RAISE a
# path's floor above a broader rule that already covers it, any position
# works — when you mean to LOWER it, you cannot via this file's rules.
#
# NOTE: the catch-all "**" rule at the bottom of this file (assigned lite)
# matches every changed file, so under highest-tier-wins semantics no file
# can ever resolve to trivial via the automated F15 check — trivial and lite
# are functionally identical there (neither hard-blocks; only irreversible
# hard-blocks, full only prints a soft hint). The trivial-labelled rules
# below still matter as the source of truth for which review pipeline a
# worker should self-declare per CLAUDE.md's QA gate table; they just don't
# change F15's own computed floor. Flagged for a human decision, not fixed
# here — fixing it means changing the matching algorithm itself, not this
# data file.
#
# PARSER HAZARD — read before adding prose to this file: the F15 bash step
# does substring matching, not YAML parsing. Any comment line that echoes
# one of the two rule field names immediately followed by a colon (as it
# would appear in a real rule) is mistaken for an actual rule line, even
# inside a `#` comment. When writing prose about the rule fields here,
# phrase around it — "pattern is" / "tier is" / "assigned X" — rather than
# reproducing "fieldname:" verbatim. (Confirmed exploitable: an earlier
# draft of this exact comment block did this and silently promoted every
# file in the repo to the full tier during verification — caught by
# before/after repro testing, not by inspection. See PR description for
# the repro.)
#
# Update protocol: append-only; if a pattern's assigned tier changes, add a
# `supersedes:` entry and keep the old one commented for one release cycle.

version: 1
generated: 2026-05-16

rules:
  # ──────────────── IRREVERSIBLE ────────────────
  # Money flows, schema changes, workflow definitions, agent identity.
  # Require: full review + 2-of-3 multi-judge + Adam sign-off.
  - pattern: "apps/web/supabase/migrations/**"
    tier: irreversible
    reason: "DB schema change — destructive replay impossible"
  - pattern: "supabase/migrations/**"
    tier: irreversible
    reason: "Root-level Supabase migrations directory"
  - pattern: ".github/workflows/**"
    tier: irreversible
    reason: "CI/CD changes affect every PR; bad workflow blocks merges"
  - pattern: ".claude/agents/**"
    tier: irreversible
    reason: "Agent definitions; bad prompt cascades across every spawn"
  - pattern: ".claude/settings.json*"
    tier: irreversible
    reason: "Runtime permission boundary — glob covers sibling drafts (e.g. .claude/settings.json.proposed); an exact-string pattern let .proposed unwire pre-tool-use.sh + stop.sh without crossing this gate"
  - pattern: ".claude/qa-tier-floor.yml*"
    tier: irreversible
    reason: "This file itself — bad tier map silently downgrades reviews. Glob covers a future .proposed draft the same way .claude/settings.json* now does"
  - pattern: ".claude/skills/MANIFEST.json"
    tier: irreversible
    reason: "Referenced by every agent's skills: field; schema-lint.js (wired into CI by #197) validates every agent against it. A trivial-tier PR pruning one entry turns every agent's lint into a failure, bricking the merge pipeline for every subsequent PR — same blast radius as .claude/agents/** and .github/workflows/**, so it must not resolve below the tier those already carry"
  - pattern: ".claude/hooks/**"
    tier: irreversible
    reason: "PostToolUse / SessionStart hooks execute on every action"
  - pattern: "apps/web/src/app/api/billing/**"
    tier: irreversible
    reason: "Paddle webhook + checkout flow — silent failure = lost revenue"
  - pattern: "apps/web/src/app/api/webhooks/**"
    tier: irreversible
    reason: "External webhook handlers — idempotency-critical"

  # ──────────────── FULL ────────────────
  # API routes, auth, agent business logic, DB queries from app code.
  - pattern: "apps/web/src/app/api/**"
    tier: full
    reason: "Public API surface; security + correctness"
  - pattern: "apps/web/src/lib/agents/**"
    tier: full
    reason: "Agent execution + LLM routing"
  - pattern: "apps/web/src/lib/auth/**"
    tier: full
    reason: "Auth helpers — Supabase session + role checks"
  - pattern: "apps/web/src/lib/credit*/**"
    tier: full
    reason: "Credit hold/confirm/release — pricing-critical"
  - pattern: "apps/web/src/middleware.ts"
    tier: full
    reason: "Every request runs through middleware"
  - pattern: "apps/web/src/inngest/**"
    tier: full
    reason: "Background jobs — failures retry silently"

  # ──────────────── IRREVERSIBLE (agency-pivot additions — 2026-05-25) ────────────────
  # Publishing, Paddle, refund, and agent-discovery flows touch money and external integrations.
  - pattern: "apps/web/src/lib/publishing/**"
    tier: irreversible
    reason: "OAuth token management + CMS push — credential leak = customer-facing data breach"
    added: "2026-05-25"
  - pattern: "apps/web/src/lib/paddle/**"
    tier: irreversible
    reason: "Billing logic — silent failure = lost revenue or incorrect charges"
    added: "2026-05-25"
  - pattern: "apps/web/src/lib/refund/**"
    tier: irreversible
    reason: "Refund ledger manipulation — append-only invariant must not be broken"
    added: "2026-05-25"
  - pattern: "apps/web/src/lib/agents/discovery/**"
    tier: irreversible
    reason: "Discovery agent touches brand_fingerprints + adam_reviewed_at gate — corrupted data cascades to all downstream agents"
    added: "2026-05-25"
  - pattern: "apps/web/src/lib/agents/brand-brief-manager/**"
    tier: irreversible
    reason: "Brand brief manager produces customer-facing deliverables — wrong output ships to customers"
    added: "2026-05-25"

  # ──────────────── FULL (agency-pivot additions — 2026-05-25) ────────────────
  # Approval gate, held-revenue accounting, and discovery non-agent helpers.
  - pattern: "apps/web/src/lib/approval/**"
    tier: full
    reason: "Approval queue state machine — incorrect transitions skip customer consent"
    added: "2026-05-25"
  - pattern: "apps/web/src/lib/held-revenue/**"
    tier: full
    reason: "Revenue hold/release logic — errors in bookings affect ARR/MRR accuracy"
    added: "2026-05-25"
  - pattern: "apps/web/src/lib/discovery/**"
    tier: full
    reason: "Discovery helpers (non-agent) — onboarding and fingerprint-generation paths"
    added: "2026-05-25"

  # ──────────────── LITE ────────────────
  # General app code: UI components, pages, utilities.
  - pattern: "apps/web/src/components/**"
    tier: lite
    reason: "UI components; visual review sufficient"
  - pattern: "apps/web/src/app/**"
    tier: lite
    reason: "App router pages — auth/api branches caught by full-tier patterns above"
  - pattern: "apps/web/src/lib/**"
    tier: lite
    reason: "General libs not caught by full-tier patterns above"
  - pattern: "apps/web/src/**"
    tier: lite
    reason: "Catch-all for app code"
  - pattern: "packages/**"
    tier: lite
    reason: "Shared packages — affect all consumers"

  # ──────────────── TRIVIAL ────────────────
  # Docs, planning, brand guidelines — text only, no executable risk.
  - pattern: "docs/**"
    tier: trivial
    reason: "Documentation — Haiku schema-lint sufficient"
  - pattern: ".claude/memory/**"
    tier: trivial
    reason: "Memory files — append-only, no runtime impact"
  - pattern: ".claude/skills/**"
    tier: trivial
    reason: "Skill SKILL.md files — load-on-demand; reader-validated"
  - pattern: "**/*.md"
    tier: trivial
    reason: "Default for markdown not caught above"

  # Anything not matched defaults to LITE (safe-by-default).
  - pattern: "**"
    tier: lite
    reason: "Default — anything not matched above"
