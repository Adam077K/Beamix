name = "beamix-bridge"
main = "src/index.ts"
compatibility_date = "2026-04-01"

# All secret env vars are injected via `wrangler secret put <VAR>` at deploy time.
# Values are NEVER stored inline here.
[vars]
# Injected secrets (placeholders — set via `wrangler secret put <VAR>`):
# Updated 2026-05-13 (WS6 6C — 12-Routine roster locked).
# Per-Routine bearer tokens (Q4 split locked — no shared CEO token):
#   ROUTINE_ADVISOR_DAILY_THINKING_TOKEN    — Advisor Daily Thinking
#   ROUTINE_MORNING_DIGEST_TOKEN            — Morning Digest
#   ROUTINE_COMPETITOR_PULSE_TOKEN          — Competitor Pulse (renamed from COMPETITOR_SIGNAL)
#   ROUTINE_GEO_ALGORITHM_SIGNAL_TOKEN      — GEO Algorithm Signal (weekly Sunday)
#   ROUTINE_CTO_DAILY_PLAN_TOKEN            — CTO Daily Plan
#   ROUTINE_CONTENT_IDEA_GENERATOR_TOKEN    — Content Idea Generator
#   ROUTINE_MONDAY_STANDUP_TOKEN            — Monday Standup (weekly Mon)
#   ROUTINE_FRIDAY_RETRO_TOKEN              — Friday Retro (weekly Fri)
#   ROUTINE_EOD_SYNC_TOKEN                  — EOD Sync
#   ROUTINE_SECURITY_WATCHER_TOKEN          — Security Watcher (Q11 NEW)
#   ROUTINE_AUTO_UNBLOCK_TOKEN              — Auto-Unblock (event-triggered)
#   ROUTINE_SYNTHESIZER_TOKEN               — Synthesizer (event-triggered @board)
#
# Per-Routine IDs (trig_<id> from claude.ai Routines page):
#   ROUTINE_<NAME>_ID  — same 12 names as above, set via `wrangler secret put`.
#
# Legacy (kept for backwards-compat — WS4 deploy artifacts, no longer routed):
#   ROUTINE_CEO_ENTRY_POINT_ID / ROUTINE_CEO_ENTRY_POINT_TOKEN
#
# Bridge core:
#   BRIDGE_HMAC_SECRET             — HMAC key used to sign outbound trust-mode specs
#   LINEAR_WEBHOOK_SECRET          — HMAC key for verifying inbound Linear webhooks
#   ANTHROPIC_API_KEY              — Console-billed API key (NOT subscription OAuth)
#   ALLOWED_ISSUERS                — Comma-separated Linear user IDs (Adam + bot accounts)
#   SHORTCUT_SECRET                — HMAC bearer secret for iOS Shortcut /idea-capture
#   TELEGRAM_BOT_TOKEN             — Telegram Bot API token (Telegram bot deferred — Q15 P0 carve-out only)
#   ADAM_TELEGRAM_CHAT_ID          — Adam's personal Telegram chat ID
#   SUPABASE_URL                   — Supabase project URL (e.g. https://xyz.supabase.co)
#   SUPABASE_SERVICE_ROLE_KEY      — Supabase service role key (server-side only)
#   LINEAR_API_KEY                 — Linear API key for creating tickets via GraphQL

[[kv_namespaces]]
binding = "BRIDGE_STATE_KV"
# Adam: fill in the id after running:
#   wrangler kv:namespace create BRIDGE_STATE_KV
id = "PLACEHOLDER_KV_NAMESPACE_ID"
preview_id = "PLACEHOLDER_KV_NAMESPACE_PREVIEW_ID"

[[durable_objects.bindings]]
name = "ROUTINE_LOCK"
class_name = "RoutineLock"

[[durable_objects.bindings]]
name = "FIRE_COUNT_DO"
class_name = "FireCountDO"

[[migrations]]
tag = "v1"
new_classes = ["RoutineLock"]

[[migrations]]
tag = "v2"
new_classes = ["FireCountDO"]

# Cron triggers are configured in Anthropic Console for the 10 standing Routines
# (those are on the Max subscription, not Workers-side crons).
# Uncomment this block if you add Workers-side cleanup cron jobs in the future:
# [triggers]
# crons = [
#   "0 3 * * *",   # 03:00 UTC daily — cleanup expired nonces and stale KV keys
# ]
