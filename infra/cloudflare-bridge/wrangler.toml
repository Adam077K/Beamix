name = "beamix-bridge"
main = "src/index.ts"
compatibility_date = "2026-04-01"

# All secret env vars are injected via `wrangler secret put <VAR>` at deploy time.
# Values are NEVER stored inline here.
[vars]
# Injected secrets (placeholders — set via `wrangler secret put <VAR>`):
#   BRIDGE_HMAC_SECRET             — HMAC key used to sign outbound trust-mode specs
#   LINEAR_WEBHOOK_SECRET          — HMAC key for verifying inbound Linear webhooks
#   ANTHROPIC_API_KEY              — Console-billed API key (NOT subscription OAuth)
#   ROUTINE_CEO_ENTRY_POINT_TOKEN  — Per-Routine bearer token for CEO Entry-point
#   ROUTINE_MORNING_DIGEST_TOKEN   — Per-Routine bearer token for Morning Digest
#   ROUTINE_EOD_SYNC_TOKEN         — Per-Routine bearer token for EOD Sync
#   ROUTINE_AUTO_UNBLOCK_TOKEN     — Per-Routine bearer token for Auto-Unblock
#   ROUTINE_MONDAY_STANDUP_TOKEN   — Per-Routine bearer token for Monday Standup
#   ROUTINE_FRIDAY_RETRO_TOKEN     — Per-Routine bearer token for Friday Retro
#   ROUTINE_COMPETITOR_SIGNAL_TOKEN       — Per-Routine bearer token for Competitor Signal
#   ROUTINE_CUSTOMER_VOICE_SIGNAL_TOKEN   — Per-Routine bearer token for Customer Voice Signal
#   ROUTINE_GEO_ALGORITHM_SIGNAL_TOKEN    — Per-Routine bearer token for GEO Algorithm Signal
#   ROUTINE_SYNTHESIZER_TOKEN      — Per-Routine bearer token for Synthesizer
#   ALLOWED_ISSUERS                — Comma-separated Linear user IDs (Adam + bot accounts)
#   SHORTCUT_SECRET                — HMAC bearer secret for iOS Shortcut /idea-capture
#   TELEGRAM_BOT_TOKEN             — Telegram Bot API token
#   ADAM_TELEGRAM_CHAT_ID          — Adam's personal Telegram chat ID
#   SUPABASE_URL                   — Supabase project URL (e.g. https://xyz.supabase.co)
#   SUPABASE_SERVICE_ROLE_KEY      — Supabase service role key (server-side only)
#   LINEAR_API_KEY                 — Linear API key for creating tickets via GraphQL

[[kv_namespaces]]
binding = "BRIDGE_STATE_KV"
# Adam: fill in the id after running:
#   wrangler kv:namespace create BRIDGE_STATE_KV
id = "PLACEHOLDER_KV_NAMESPACE_ID"
preview_id = "PLACEHOLDER_KV_NAMESPACE_PREVIEW_ID"

[[durable_objects.bindings]]
name = "ROUTINE_LOCK"
class_name = "RoutineLock"

[[durable_objects.bindings]]
name = "FIRE_COUNT_DO"
class_name = "FireCountDO"

[[migrations]]
tag = "v1"
new_classes = ["RoutineLock"]

[[migrations]]
tag = "v2"
new_classes = ["FireCountDO"]

# Cron triggers are configured in Anthropic Console for the 10 standing Routines
# (those are on the Max subscription, not Workers-side crons).
# Uncomment this block if you add Workers-side cleanup cron jobs in the future:
# [triggers]
# crons = [
#   "0 3 * * *",   # 03:00 UTC daily — cleanup expired nonces and stale KV keys
# ]
