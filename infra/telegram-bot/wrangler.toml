name = "beamix-telegram-bot"
main = "src/index.ts"
compatibility_date = "2026-04-01"

# Telegram bots have a dedicated webhook URL separate from the bridge.
# This Worker receives Telegram updates and forwards to the bridge /telegram endpoint.
#
# All secrets injected via `wrangler secret put <VAR>`:
#   TELEGRAM_BOT_TOKEN     — Telegram Bot API token
#   ADAM_TELEGRAM_CHAT_ID  — Adam's personal Telegram chat ID (numeric string)
#   BRIDGE_INTERNAL_URL    — URL of the beamix-bridge Worker (e.g. https://beamix-bridge.workers.dev)
#   BRIDGE_HMAC_SECRET     — Shared HMAC secret for internal bridge authentication

[vars]
# Set Telegram webhook after deploy:
#   curl -X POST https://api.telegram.org/bot<TOKEN>/setWebhook
#        -H 'Content-Type: application/json'
#        -d '{"url": "https://beamix-telegram-bot.workers.dev/webhook"}'

[[kv_namespaces]]
binding = "TELEGRAM_QUEUE_KV"
# Adam: fill in after running:
#   wrangler kv:namespace create TELEGRAM_QUEUE_KV
id = "PLACEHOLDER_TELEGRAM_KV_NAMESPACE_ID"
preview_id = "PLACEHOLDER_TELEGRAM_KV_NAMESPACE_PREVIEW_ID"
