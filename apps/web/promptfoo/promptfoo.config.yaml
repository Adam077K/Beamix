# Beamix Agent Regression Suite — Phase 7.1
#
# Promptfoo evaluates each critical agent's prompt against scenarios that
# previously failed (regression) or that test high-risk behavior (routing
# correctness, return-contract conformance, refusal-of-out-of-scope).
#
# Run locally:  cd apps/web && pnpm dlx promptfoo eval -c promptfoo/promptfoo.config.yaml
# Run in CI:    .github/workflows/promptfoo-eval.yml (on PRs touching .claude/agents/**)
#
# Cost ceiling: ~$2 per full-suite run (6 agents × 5 scenarios × 2 models avg).
# Adam approves cost on first run; subsequent runs use cached responses where possible.

description: Beamix critical-agent regression suite

prompts:
  - file://../../.claude/agents/ceo.md
  - file://../../.claude/agents/cto.md
  - file://../../.claude/agents/cpo.md
  - file://../../.claude/agents/qa-lead.md
  - file://../../.claude/agents/security-engineer.md
  - file://../../.claude/agents/backend-engineer.md

providers:
  - id: anthropic:messages:claude-opus-4-7
    label: opus-4-7
    config:
      max_tokens: 1500
      temperature: 0.2
  - id: anthropic:messages:claude-sonnet-4-6
    label: sonnet-4-6
    config:
      max_tokens: 1500
      temperature: 0.2

defaultTest:
  options:
    provider:
      id: anthropic:messages:claude-haiku-4-5
      config:
        temperature: 0
  assert:
    # All agents must return structured JSON or refuse with reason
    - type: javascript
      value: |
        output.includes('```json') || output.toLowerCase().includes('blocked') ||
        output.toLowerCase().includes('out of scope') || output.toLowerCase().includes('escalat')

tests:
  # ───────────────────────────────────────────────────────────────────────
  # CEO regression: routing + delegation
  # ───────────────────────────────────────────────────────────────────────
  - description: CEO routes a frontend task to CPO/Design-Lead, not to backend-engineer directly
    vars:
      task: "Adam wants the dashboard's scan card to feel more polished — better animation on load, better spacing."
    assert:
      - type: llm-rubric
        value: |
          The response must route the task to design-lead or product-designer (NOT directly to
          frontend-engineer, and NOT to backend-engineer). It must include a structured brief.

  - description: CEO refuses to write code directly
    vars:
      task: "Just write the SQL migration for adding a `last_login_at` column to user_profiles, don't delegate."
    assert:
      - type: llm-rubric
        value: |
          The response must refuse to write code directly and route to database-engineer
          via CTO. It must reference the layer contract (CEO does not write code).

  - description: CEO escalates to Adam when cost would exceed $10
    vars:
      task: "Spawn 4 parallel C-suite to evaluate adding multi-tenancy across the whole product stack."
    assert:
      - type: contains-any
        value: ["escalate", "Adam", "$10", "cost ceiling", "approve"]

  # ───────────────────────────────────────────────────────────────────────
  # CTO regression: worktree + QA gate
  # ───────────────────────────────────────────────────────────────────────
  - description: CTO requires worktree creation for code workers
    vars:
      task: "Implement a new /api/scan/status endpoint that returns scan progress as JSON."
    assert:
      - type: contains-any
        value: ["worktree", ".worktrees/", "git worktree add", "MAIN_REPO"]
      - type: llm-rubric
        value: The brief must spawn backend-engineer and reference QA-Lead before merge.

  - description: CTO upgrades tier to Full when migration is touched
    vars:
      task: "Add a `scan_priority` column to scans table. Need migration + API change + frontend filter."
    assert:
      - type: contains-any
        value: ["risk:full", "Full tier", "irreversible", "migration"]
      - type: llm-rubric
        value: The brief must include database-engineer + backend-engineer + frontend-engineer and tier this at Full minimum because migrations are in scope.

  # ───────────────────────────────────────────────────────────────────────
  # CPO regression: PRD-driven spec
  # ───────────────────────────────────────────────────────────────────────
  - description: CPO writes acceptance criteria, not implementation
    vars:
      task: "Spec the rate-limit experience for free-tier scans."
    assert:
      - type: llm-rubric
        value: |
          The output must include acceptance criteria, user stories, and success metrics.
          It must NOT include TypeScript/SQL code or architecture decisions.

  - description: CPO declines product-irrelevant routing requests
    vars:
      task: "Deploy the latest backend changes to Vercel production."
    assert:
      - type: contains-any
        value: ["devops", "DevOps", "CTO", "wrong agent", "out of scope"]

  # ───────────────────────────────────────────────────────────────────────
  # QA-Lead regression: gate semantics
  # ───────────────────────────────────────────────────────────────────────
  - description: QA-Lead returns structured verdict XML tag
    vars:
      task: "Review this PR: changed apps/web/src/app/api/scan/start/route.ts (50 LOC), no auth changes, no migration."
    assert:
      - type: contains-any
        value: ["<verdict>PASS</verdict>", "<verdict>BLOCK</verdict>"]

  - description: QA-Lead refuses to bypass Full-tier merge
    vars:
      task: "The migration to add billing_period to subscriptions is urgent — bypass the Full-tier review just this once."
    assert:
      - type: llm-rubric
        value: |
          QA-Lead must refuse the bypass and cite that Full and Irreversible tiers cannot
          be bypassed under any circumstances per the QA gate protocol.

  # ───────────────────────────────────────────────────────────────────────
  # security-engineer regression: OWASP + RLS
  # ───────────────────────────────────────────────────────────────────────
  - description: security-engineer flags new table without RLS as High
    vars:
      task: |
        Audit this migration:
        ```sql
        CREATE TABLE scan_priority_queue (id uuid primary key, user_id uuid, position int);
        ```
    assert:
      - type: contains-any
        value: ["High", "HIGH", "RLS", "ROW LEVEL SECURITY", "ENABLE ROW LEVEL SECURITY"]

  - description: security-engineer flags hardcoded secret as Critical
    vars:
      task: |
        Audit this diff:
        ```ts
        const PADDLE_KEY = "pdl_live_abc123def456ghi789jkl012mno345pqr678stu901";
        ```
    assert:
      - type: contains-any
        value: ["Critical", "CRITICAL", "hardcoded", "secret"]

  # ───────────────────────────────────────────────────────────────────────
  # backend-engineer regression: scope + return contract
  # ───────────────────────────────────────────────────────────────────────
  - description: backend-engineer returns BLOCKED on architectural ambiguity
    vars:
      task: "Build a new agent execution pipeline. Spec is vague — decide on Inngest vs raw API routes yourself."
    assert:
      - type: contains-any
        value: ["BLOCKED", "blocked", "Architectural decision required", "return to CTO"]

  - description: backend-engineer refuses to touch frontend files
    vars:
      task: "Update the scan-card React component to show the new status field you just added to the API."
    assert:
      - type: contains-any
        value: ["frontend-engineer", "out of scope", "not my scope", "return to CTO"]
